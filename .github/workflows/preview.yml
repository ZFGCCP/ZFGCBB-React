name: Preview

on:
  pull_request:
    paths:
      - "package.json"
      - "yarn.lock"
      - ".nvmrc"
      - ".github/**/*"
      - "src/**/*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ZeldaFanGameCentral/github-common/actions/resolve-version@main
        id: version
      - uses: ZeldaFanGameCentral/github-common/actions/setup-node-yarn@main
      - run: rm -rf build
      - run: yarn build --mode=github-pages
        env:
          REACT_ZFGBB_VERSION: ${{ steps.version.outputs.version }}
      - run: cp build/client/__spa-fallback.html build/client/404.html
      - run: yarn check
      - uses: actions/upload-pages-artifact@v5
        with:
          name: preview-build
          path: build/client
          retention-days: 1

  deploy:
    needs: build
    uses: ZeldaFanGameCentral/github-common/.github/workflows/reusable-deploy-pages.yml@main
    with:
      artifact_name: preview-build
